<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/inicio.css"> <!-- Enlace al archivo CSS -->
    <link href="https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="icon" href="img/sinfondo.png" type="imge/png"> 
    <title>Actividades en Imágenes</title>
</head>
<body class="encabza">
    <header>
        <h1>Escuela Juana Manso - Corrientes, Argentina</h1>
    </header>

    <!-- Contenedor del logo en forma circular con carrusel -->
    <div id="logoCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/sinfondo.png" class="d-block mx-auto" alt="Logo Escuela Juana Manso" style="width: 200px; height: 200px; border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
            </div>
            <div class="carousel-item">
                <img src="img/logo actual2.png" class="d-block mx-auto" alt="Otro Logo" style="width: 200px; height: 200px; border-radius: 50%; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);">
            </div>
        </div>
    </div>

<!-- Botón debajo del carrusel del logo -->
<div class="text-center mt-3">
    <a href="index.html" class="btn-custom">Ingresar</a>
</div>

    <!-- Carrusel con imágenes detrás del logo -->
    <div id="carouselExampleControls" class="carousel slide carousel-fade" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/juana_manso_aula_virtual-transformed.png" class="d-block w-100" alt="Frente de la escuela">
            </div>
            <div class="carousel-item">
                <img src="img/promo24.png" class="d-block w-100" alt="Evento deportivo">
            </div>
            <div class="carousel-item">
                <img src="img/imagen2manso.png" class="d-block w-100" alt="Clase de informática">
            </div>
            <div class="carousel-item">
                <img src="img/frente juana manso.png" class="d-block w-100" alt="Acto escolar">
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Anterior</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">Siguiente</span>
        </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
</body>
</html>
